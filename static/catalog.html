<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sneakerdope — Каталог</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/main.css" />
</head>
<body>

  <header class="site-header">
    <div class="site-header__inner">
      <a href="index.html" class="logo">Sneakerdope</a>
      <nav class="main-nav">
        <a href="index.html">О нас</a>
        <a href="catalog.html" aria-current="page">Каталог</a>
        <a href="contacts.html">Где нас найти?</a>
      </nav>
      <div class="header-actions">
        <a href="cart.html" class="icon-btn" aria-label="Корзина">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M6 8h12l-1 12H7L6 8Z"/><path d="M9 8a3 3 0 0 1 6 0"/></svg>
          <span class="cart-count">0</span>
        </a>
        <div class="auth-links">
          <a href="auth.html">Войти</a>
          <span class="divider">/</span>
          <a href="auth.html">Регистрация</a>
        </div>
      </div>
    </div>
  </header>

  <main>

    <div class="page-head">
      <div class="container">
        <p class="page-head__crumbs">Главная / Каталог</p>
        <h1>Каталог</h1>
      </div>
    </div>

    <section>
      <div class="container catalog-layout">

        <!-- ===== Filters ===== -->
        <aside class="filters">

          <div class="filters__group" data-filter-group="price">
            <p class="filters__title">Цена, ₽</p>
            <div class="price-range">
              <input type="number" placeholder="от" aria-label="Цена от" />
              <span>—</span>
              <input type="number" placeholder="до" aria-label="Цена до" />
            </div>
          </div>

          <div class="filters__group" data-filter-group="brand">
            <p class="filters__title">Бренд</p>
            <div class="filters__options" data-options-list>
              <!-- список брендов подставляется из JS (main.js, renderBrandFilter) -->
            </div>
          </div>

          <div class="filters__group" data-filter-group="size">
            <p class="filters__title">Размер, RU</p>
            <div class="filters__options" data-options-list>
              <!-- список размеров подставляется из JS (main.js, renderSizeFilter) -->
            </div>
          </div>

          <div class="filters__group" data-filter-group="gender">
            <p class="filters__title">Категория</p>
            <label class="filters__option"><input type="checkbox" data-gender="male" /> Мужские</label>
            <label class="filters__option"><input type="checkbox" data-gender="female" /> Женские</label>
            <label class="filters__option"><input type="checkbox" data-gender="kids" /> Детские</label>
          </div>

          <button class="btn btn--ghost btn--small btn--full">Сбросить фильтры</button>
        </aside>

        <!-- ===== Grid ===== -->

        <div>
          <div class="catalog-toolbar">
            <p class="catalog-toolbar__count">Загрузка...</p>
            <div class="sort">
              <label for="sort-select">Сортировать:</label>
              <select id="sort-select">
                <option>По новизне</option>
                <option>По цене: сначала дешевле</option>
                <option>По цене: сначала дороже</option>
                <option>По размеру</option>
              </select>
            </div>
          </div>

          <div class="catalog-grid"></div>

          <nav class="pagination" aria-label="Пагинация" style="display:none;"></nav>
        </div>

      </div>
    </section>

  </main>

  <footer class="site-footer">
    <div class="container">
      <div class="footer-bottom">
        <span>© 2026 Sneakerdope.</span>
        <a href="contacts.html">Где нас найти?</a>
      </div>
    </div>
  </footer>

  <script src="js/main.js" defer></script>
</body>
</html>
